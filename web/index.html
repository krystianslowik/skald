<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The top of the night sky behind the header, so the browser chrome runs into it. -->
    <meta name="theme-color" content="#101516" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skald" />
    <title>Skald</title>
    <script>
      // Boot watchdog. If the app's script never runs (WebKit can keep a load
      // that failed offline, even across a reload), say so instead of leaving
      // a blank page, and fetch the page's scripts again before reloading:
      // an ordinary request is what makes WebKit drop the failed load.
      (function () {
        var KEY = "skald.bootRetry", shown = false;
        var booted = function () { return document.documentElement.hasAttribute("data-booted"); };
        var assets = function () {
          var out = [], els = document.querySelectorAll("script[type=module][src], link[rel=modulepreload][href], link[rel=stylesheet][href]");
          for (var i = 0; i < els.length; i++) {
            try {
              var u = new URL(els[i].src || els[i].href, location.href);
              if (u.origin === location.origin && u.pathname.indexOf("/assets/") === 0 && out.indexOf(u.pathname) < 0) out.push(u.pathname);
            } catch (e) {}
          }
          return out;
        };
        // Any answer will do (a 404 means a newer build, which the reload fetches); no answer in 8 s, or offline, keeps the note.
        var reach = function (u) {
          return Promise.race([
            fetch(u).then(function () { return true; }, function () { return false; }),
            new Promise(function (r) { setTimeout(function () { r(false); }, 8000); }),
          ]);
        };
        var busy = false;
        var recover = function (note) {
          if (busy) return;
          busy = true;
          note.textContent = note.getAttribute("data-busy");
          Promise.all(assets().map(reach)).then(function (ok) {
            busy = false;
            if (navigator.onLine !== false && ok.indexOf(false) < 0) location.reload();
            else note.textContent = note.getAttribute("data-idle");
          });
        };
        var show = function () {
          if (shown || booted()) return;
          shown = true;
          var pl = (document.documentElement.lang || "").indexOf("pl") === 0;
          var box = document.createElement("div");
          box.id = "skald-boot";
          box.setAttribute("role", "alert");
          box.style.cssText = "position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#0e0b09;color:#f1eeeb;font:16px/1.4 system-ui,sans-serif;text-align:center;z-index:2147483647";
          var p = document.createElement("p");
          p.textContent = pl ? "Skald nie mógł się uruchomić. Sprawdź połączenie i odśwież." : "Skald could not start. Check the connection and reload.";
          var b = document.createElement("button");
          b.type = "button";
          b.setAttribute("data-idle", pl ? "Odśwież" : "Reload");
          b.setAttribute("data-busy", pl ? "Ładowanie..." : "Loading...");
          b.textContent = b.getAttribute("data-idle");
          b.style.cssText = "margin-top:16px;padding:10px 24px;border:1px solid #f3b867;border-radius:8px;background:transparent;color:#f3b867;font:inherit;font-weight:700";
          b.onclick = function () { recover(b); };
          var inner = document.createElement("div");
          inner.appendChild(p);
          inner.appendChild(b);
          box.appendChild(inner);
          document.body.appendChild(box);
          // Once per minute on its own, so a script that stays broken cannot reload in a loop.
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last > 60000 || last > Date.now()) {
              sessionStorage.setItem(KEY, String(Date.now()));
              recover(b);
            }
          } catch (e) {}
        };
        addEventListener("error", function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT" && t.type === "module") show();
        }, true);
        addEventListener("load", function () { setTimeout(show, 3000); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
