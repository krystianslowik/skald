# Copy to secrets.yaml (gitignored), replace every value, then apply -k.
# Generate values with:
#   openssl rand -hex 32                        # AGENT_TOKEN, SESSION_SECRET
#   openssl rand -hex 24                        # SUPERVISOR_HTTP_PASS
#   printf '%s' 'panel password' | docker run --rm -i ghcr.io/krystianslowik/skald-web hash-password
#   openssl rand -hex 24                        # BRIDGE_TOKEN (bridge component only)
# Prefer your secret manager (SOPS, External Secrets, Sealed Secrets) over a
# plaintext file for anything beyond a test cluster.
apiVersion: v1
kind: Secret
metadata:
  name: valheim-server-pass
type: Opaque
stringData:
  # The password players type after the join code (at least 5 characters).
  server-pass: "change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: skald-agent
type: Opaque
stringData:
  # Shared between the agent sidecar and skald-web.
  AGENT_TOKEN: "replace-with-openssl-rand-hex-32"
  # supervisord XML-RPC password, shared between the game container and the agent.
  SUPERVISOR_HTTP_PASS: "replace-with-openssl-rand-hex-24"
  # Only with the bridge component: shared between the agent and the game
  # container's plugin (SKALD_BRIDGE_TOKEN). At least 16 characters.
  # BRIDGE_TOKEN: "replace-with-openssl-rand-hex-24"
---
apiVersion: v1
kind: Secret
metadata:
  name: skald-web
type: Opaque
stringData:
  # argon2id hash of the dashboard password (never the password itself).
  PANEL_PASSWORD_HASH: "$argon2id$replace-me"
  SESSION_SECRET: "replace-with-openssl-rand-hex-32"
  # Optional: with it, the panel password only views and changing anything
  # (admin commands, restarts, settings) needs this admin password too.
  # Without it, everyone signed in is an admin. Same hash-password command.
  # ADMIN_PASSWORD_HASH: "$argon2id$replace-me"
  # Optional: Discord notifications (joins, deaths, raids, new join codes) to
  # this channel webhook. Without it, an admin can set one in the admin sheet;
  # with it, this one wins and the panel shows it read-only.
  # DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/replace-me"
