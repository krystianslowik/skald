# One entry per area and ecosystem, checked once a month. Each entry opens one
# pull request for its minor and patch updates and a second one ("-major") for
# major updates, so majors stay visible without arriving as a dozen PRs.
version: 2
updates:
  # ---- agent ----------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /agent
    schedule: {interval: monthly}
    labels: [dependencies, "area:agent"]
    groups:
      agent-go: {patterns: ["*"], update-types: [minor, patch]}
      agent-go-major: {patterns: ["*"], update-types: [major]}
  - package-ecosystem: docker
    directory: /agent
    schedule: {interval: monthly}
    labels: [dependencies, "area:agent"]
    groups:
      agent-docker: {patterns: ["*"], update-types: [minor, patch]}
      agent-docker-major: {patterns: ["*"], update-types: [major]}

  # ---- web ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: monthly}
    labels: [dependencies, "area:web"]
    groups:
      web-npm: {patterns: ["*"], update-types: [minor, patch]}
      web-npm-major: {patterns: ["*"], update-types: [major]}

  # ---- server ---------------------------------------------------------------
  - package-ecosystem: bun
    directory: /server
    schedule: {interval: monthly}
    labels: [dependencies, "area:server"]
    groups:
      server-bun: {patterns: ["*"], update-types: [minor, patch]}
      server-bun-major: {patterns: ["*"], update-types: [major]}
  - package-ecosystem: docker
    directory: /server
    schedule: {interval: monthly}
    labels: [dependencies, "area:server"]
    ignore:
      # Production images follow Node's LTS lines only (even majors); odd
      # majors are short-lived current releases.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
    groups:
      server-docker: {patterns: ["*"], update-types: [minor, patch]}
      server-docker-major: {patterns: ["*"], update-types: [major]}

  # ---- bridge ---------------------------------------------------------------
  - package-ecosystem: nuget
    directories: [/bridge/plugin, /bridge/tests]
    schedule: {interval: monthly}
    labels: [dependencies, "area:bridge"]
    ignore:
      # Pinned to the Unity engine the game ships (6000.0.75f1); it moves
      # with a Valheim update, not with the package feed.
      - dependency-name: UnityEngine.Modules
      # BepInEx 6 is pre-release; BepInExPack_Valheim ships BepInEx 5.
      - dependency-name: BepInEx.Core
        update-types: ["version-update:semver-major"]
    groups:
      bridge-nuget: {patterns: ["*"], update-types: [minor, patch]}
      bridge-nuget-major: {patterns: ["*"], update-types: [major]}
  - package-ecosystem: docker
    directory: /bridge
    schedule: {interval: monthly}
    labels: [dependencies, "area:bridge"]
    groups:
      bridge-docker: {patterns: ["*"], update-types: [minor, patch]}
      bridge-docker-major: {patterns: ["*"], update-types: [major]}

  # ---- terrain --------------------------------------------------------------
  - package-ecosystem: nuget
    directory: /terrain/plugin
    schedule: {interval: monthly}
    labels: [dependencies, "area:terrain"]
    ignore:
      - dependency-name: UnityEngine.Modules
      - dependency-name: BepInEx.Core
        update-types: ["version-update:semver-major"]
    groups:
      terrain-nuget: {patterns: ["*"], update-types: [minor, patch]}
      terrain-nuget-major: {patterns: ["*"], update-types: [major]}
  - package-ecosystem: docker
    directory: /terrain
    schedule: {interval: monthly}
    labels: [dependencies, "area:terrain"]
    groups:
      terrain-docker: {patterns: ["*"], update-types: [minor, patch]}
      terrain-docker-major: {patterns: ["*"], update-types: [major]}

  # ---- icons ----------------------------------------------------------------
  - package-ecosystem: pip
    directory: /icons
    schedule: {interval: monthly}
    labels: [dependencies, "area:icons"]
    groups:
      icons-pip: {patterns: ["*"], update-types: [minor, patch]}
      icons-pip-major: {patterns: ["*"], update-types: [major]}
  - package-ecosystem: docker
    directory: /icons
    schedule: {interval: monthly}
    labels: [dependencies, "area:icons"]
    groups:
      icons-docker: {patterns: ["*"], update-types: [minor, patch]}
      icons-docker-major: {patterns: ["*"], update-types: [major]}

  # ---- CI -------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    labels: [dependencies, "area:deploy"]
    groups:
      actions: {patterns: ["*"], update-types: [minor, patch]}
      actions-major: {patterns: ["*"], update-types: [major]}
