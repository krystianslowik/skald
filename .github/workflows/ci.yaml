name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  server:
    name: server (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  web:
    name: web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  icons:
    name: icons (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icons
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      # The same pinned set as the image, without fmod_toolkit (see requirements.txt).
      - run: pip install --no-deps -r requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  images:
    name: images build (amd64)
    runs-on: ubuntu-latest
    needs: [agent, server, web, icons]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: skald-agent
        uses: docker/build-push-action@v6.18.0
        with:
          context: agent
          platforms: linux/amd64
          push: false
      - name: skald-web
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: false
      - name: skald-icons
        uses: docker/build-push-action@v6.18.0
        with:
          context: icons
          platforms: linux/amd64
          push: false
