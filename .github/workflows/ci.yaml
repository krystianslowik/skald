name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  server:
    name: server (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  web:
    name: web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  icons:
    name: icons (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icons
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      # The same pinned set as the image, without fmod_toolkit (see requirements.txt).
      - run: pip install --no-deps -r requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  terrain:
    name: terrain (C# plugin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terrain
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 9.0.x
      # Bound to the game by reflection: builds against BepInEx and Unity
      # reference assemblies from the BepInEx feed, no game files needed.
      - run: dotnet build plugin -c Release -o out
      - run: bash -n run.sh && bash -n hook.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SkaldTerrain
          path: terrain/out/SkaldTerrain.dll
          if-no-files-found: error

  bridge:
    name: bridge (C# plugin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests
      # The reference DLLs only change with a game build, so keep them between
      # runs instead of fetching them from Steam every time.
      - uses: actions/cache@v6.1.0
        with:
          path: bridge/refs
          key: bridge-refs-${{ hashFiles('bridge/build.sh') }}
      # Compiled against the game's own assemblies: build.sh fetches the six
      # it needs (about 2 MB, anonymous) and BepInEx.dll, never committed.
      - run: sh build.sh
      - run: sh -n install.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SkaldBridge
          path: bridge/out/SkaldBridge.dll
          if-no-files-found: error

  images:
    name: images build (amd64)
    runs-on: ubuntu-latest
    needs: [agent, server, web, icons, terrain, bridge]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: skald-agent
        uses: docker/build-push-action@v7.4.0
        with:
          context: agent
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=skald-agent
          cache-to: type=gha,mode=max,scope=skald-agent
      - name: skald-web
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=skald-web
          cache-to: type=gha,mode=max,scope=skald-web
      - name: skald-icons
        uses: docker/build-push-action@v7.4.0
        with:
          context: icons
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=skald-icons
          cache-to: type=gha,mode=max,scope=skald-icons
      - name: skald-terrain
        uses: docker/build-push-action@v7.4.0
        with:
          context: terrain
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=skald-terrain
          cache-to: type=gha,mode=max,scope=skald-terrain
      - name: skald-bridge
        uses: docker/build-push-action@v7.4.0
        with:
          context: bridge
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=skald-bridge
          cache-to: type=gha,mode=max,scope=skald-bridge
