name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pure Go, cross-compiled on the runner.
          - image: skald-agent
            context: agent
            file: agent/Dockerfile
          # SPA built once, Bun binary cross-compiled per arch.
          - image: skald-web
            context: .
            file: server/Dockerfile
          # Wheels are built in their own stage; UnityPy is compiled for arm64.
          - image: skald-icons
            context: icons
            file: icons/Dockerfile
          # The plugin is built once on the runner's platform; the image is busybox.
          - image: skald-terrain
            context: terrain
            file: terrain/Dockerfile
          # Same pattern: the plugin is built once (reference DLLs fetched
          # anonymously in the build stage), the image is busybox.
          - image: skald-bridge
            context: bridge
            file: bridge/Dockerfile
    steps:
      - uses: actions/checkout@v4.2.2
      # The arm64 runtime stages run a few shell commands under emulation.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    # Publishes the GitHub release for the tag once every image is pushed, with
    # the matching CHANGELOG section as notes.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0,"## ["v"]")==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Images: ghcr.io/krystianslowik/skald-*:$v" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
